<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alta de Socios - Empleado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/estilos.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-warning fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand">Alta de Socios</span>
      <a href="empleado.html" class="btn btn-outline-dark">Volver</a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container pt-5 mt-4">
    <h2 class="mb-4">Registrar nuevo socio</h2>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" required />
      </div>
      <div class="col-md-6">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellido" required />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="col-md-6">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" required />
      </div>
      <div class="col-md-6">
        <label for="fecha" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="fecha" required />
      </div>
      <div class="col-md-6">
        <label for="plan" class="form-label">Plan seleccionado</label>
        <select class="form-select" id="plan" required>
          <option value="">Seleccionar</option>
          <option>Plan Básico</option>
          <option>Plan Intermedio</option>
          <option>Plan Premium</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-warning w-100">Registrar Socio</button>
      </div>
    </form>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
