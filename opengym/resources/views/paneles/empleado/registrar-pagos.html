<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Pagos - Empleado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="/css/estilos.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-warning fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand">Registrar Pagos</span>
      <a href="empleado.html" class="btn btn-outline-dark">Volver</a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container pt-5 mt-4">
    <h2 class="mb-4">Formulario de pago</h2>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="socio" class="form-label">ID del Socio</label>
        <input type="text" class="form-control" id="socio" required />
      </div>
      <div class="col-md-6">
        <label for="monto" class="form-label">Monto</label>
        <input type="number" class="form-control" id="monto" required />
      </div>
      <div class="col-md-6">
        <label for="fecha" class="form-label">Fecha de pago</label>
        <input type="date" class="form-control" id="fecha" required />
      </div>
      <div class="col-md-6">
        <label for="metodo" class="form-label">Método de pago</label>
        <select class="form-select" id="metodo" required>
          <option value="">Seleccionar</option>
          <option>Efectivo</option>
          <option>Tarjeta</option>
          <option>Transferencia</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-warning w-100">Registrar Pago</button>
      </div>
    </form>

    <hr class="my-5" />

    <h3>Historial de pagos recientes</h3>
    <table class="table table-bordered table-hover mt-3">
      <thead class="table-warning">
        <tr>
          <th>ID Socio</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th>Método</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>001</td><td>$500</td><td>2025-10-20</td><td>Tarjeta</td>
        </tr>
        <!-- Más registros aquí -->
      </tbody>
    </table>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
