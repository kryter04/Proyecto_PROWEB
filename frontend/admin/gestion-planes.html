<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de Planes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/estilos.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-dark bg-success fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand">Gestión de Planes</span>
      <a href="admin.html" class="btn btn-outline-light">Volver</a>
    </div>
  </nav>

  <main class="container pt-5 mt-4">
    <h2 class="mb-4">Planes disponibles</h2>
    <table class="table table-bordered table-hover">
      <thead class="table-success">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Duración</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>01</td><td>Plan Básico</td><td>$300</td><td>Mensual</td>
          <td>
            <button class="btn btn-sm btn-warning">Editar</button>
            <button class="btn btn-sm btn-danger">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
    <a href="#" class="btn btn-success mt-3">Agregar nuevo plan</a>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
